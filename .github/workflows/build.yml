name: MOBAN_BUILD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # CUDA 官方镜像自带完整 toolkit，无需每次 apt 下载 ~4GB 再安装。
    # 镜像内为 root 环境，不要使用 sudo。
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.5.1-devel-ubuntu22.04
    env:
      # ubuntu 22.04 自带 cmake 3.22，低于项目要求的 3.26，固定用 3.31.x
      CMAKE_VERSION: 3.31.12
    steps:
      - name: Prepare toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential ninja-build
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | tar -xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Build
        run: cmake --build build
      - name: Build and run tests
        run: |
          cmake --build build --target build-tests
          ctest --test-dir build --output-on-failure
